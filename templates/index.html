<!DOCTYPE html>
<html>
    <head>
    <title>財報淨利查詢</title>
    <script>
        const chartLabels={{ labels| tojson }};
        const chartValues={{ values| tojson }};
    </script>
    <!-- 自己寫的js-->
    <script src="/static/chartbar.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="/static/style.css" rel="stylesheet">
    </head>
    <body>
        <h2 style="text-align:center; margin:20px;">簡單淨利圖</h2>
        <div class="container mt-4">
            <div class="row align-items-center">
                <!-- 左邊公司資訊 -->
                <div class="col-md-4">

                    {% if error %}
                        <p style="color:red;">{{ error }}</p>
                    {% endif %}
                    <form class="row g-2"  action="/" method="get">
                        <div class="col-12 col-sm-8">
                        <input class="form-control" type="text" name="symbol" placeholder="symbol(股票簡稱)" required autofocus>
                        </div>
                        <div class="col-12 col-sm-4">
                        <button class="btn btn-primary" type="submit">查詢</button>
                        </div>
                    </form>
                    <h2>公司：{{ name }}</h2>
                    <p>年度範圍：{{ labels[0] }} - {{ labels[-1] }}</p>
                    <p>資料來源：Yahoo Finance</p>
                    <div style="margin-right:30px;">
                        <p>說明：輸入美國股市公司名稱的代號，就可以查詢公司近三年的淨利</p>
                    </div>
                </div>
                 <!-- 右邊圖表 -->
            <div class="col-md-8">
                <canvas id="mychart" width="100%" height="60"></canvas>
            </div>
        </div>
    </div>

    </body>

</html>
